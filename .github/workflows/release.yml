name: Build and Release Windows Executable

# Manual trigger ("Run workflow" button on GitHub) or by pushing a version tag
# (e.g. `git tag v1.2.0 && git push origin v1.2.0`). Either way the build itself
# is driven by `npm run release`, the same command used for local builds, so CI
# and local output are guaranteed to match.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: Backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build versioned executable
        run: npm run release
        env:
          # Avoids GitHub API rate-limiting when pkg fetches its base Node binary.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: pkg_version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=v$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Verify tag matches package.json version (tag-triggered runs only)
        if: github.ref_type == 'tag'
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.pkg_version.outputs.version }}") {
            Write-Error "Pushed tag (${{ github.ref_name }}) does not match package.json version (${{ steps.pkg_version.outputs.version }}). Bump package.json's version before tagging, or retag to match."
            exit 1
          }
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-jarvis-${{ steps.pkg_version.outputs.version }}
          path: releases/helpdesk-jarvis-${{ steps.pkg_version.outputs.version }}.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: Helpdesk Jarvis ${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          files: releases/helpdesk-jarvis-${{ steps.pkg_version.outputs.version }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
